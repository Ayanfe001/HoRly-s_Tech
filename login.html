<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.5">
    <title>Login | HoRly's Tech</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script> 

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0ea5e9">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    
    <style>
        :root {
            --primary: #0ea5e9;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-highlight: rgba(255, 255, 255, 0.2);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: white;
            overflow: hidden; 
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.5s ease;
        }

        .orbitron { font-family: 'Orbitron', sans-serif; }

        /* Liquid Glass */
        .liquid-glass-heavy {
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(60px) saturate(200%);
            -webkit-backdrop-filter: blur(60px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 2.5rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 0 rgba(255,255,255,0.2);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            color: white;
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.2), inset 0 0 10px rgba(255,255,255,0.05);
            outline: none;
        }

        .liquid-button {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .liquid-button:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.02); border-color: rgba(255, 255, 255, 0.4); }

        /* Ambient Animated Background */
        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; overflow: hidden; background: #000;
        }
        .orb {
            position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.6;
            animation: float 20s infinite alternate ease-in-out; mix-blend-mode: screen;
        }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(100px, 150px) scale(1.2); } }

        /* Form switching animation */
        .form-container { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .hidden-form { opacity: 0; transform: translateX(50px); pointer-events: none; position: absolute; visibility: hidden; }
        .active-form { opacity: 1; transform: translateX(0); position: relative; visibility: visible; }
    </style>
</head>
<body class="selection:bg-white/30 flex items-center justify-center min-h-screen">

    <div class="ambient-bg">
        <div class="orb bg-sky-600/40 w-[600px] h-[600px] top-[-10%] left-[-10%]"></div>
        <div class="orb bg-indigo-600/30 w-[500px] h-[500px] bottom-[-20%] right-[-10%]" style="animation-delay: -5s; animation-duration: 25s;"></div>
        <div class="orb bg-purple-600/20 w-[400px] h-[400px] top-[40%] left-[30%]" style="animation-delay: -10s; animation-duration: 15s;"></div>
    </div>

    <div class="w-full max-w-md px-6 relative z-10">
        
        <a href="index.html" class="absolute -top-16 left-6 text-white/50 hover:text-white transition-colors flex items-center gap-2 text-sm interaction-btn">
            <i class="fas fa-arrow-left"></i> Back to Store
        </a>

        <div class="liquid-glass-heavy p-10 w-full relative overflow-hidden">
            <div class="flex items-center justify-center gap-3 mb-8">
                <div class="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center font-bold text-white shadow-inner border border-white/20 text-xl">H</div>
                <h1 class="orbitron text-2xl font-bold tracking-tighter text-white">HoRly’s_<span class="text-sky-400">Tech</span></h1>
            </div>

            <div class="relative w-full">
                <!-- LOGIN FORM -->
                <form id="loginForm" class="form-container active-form space-y-4" onsubmit="handleAuth(event, 'login')">
                    <div class="text-center mb-6">
                        <h2 class="text-2xl font-bold text-white mb-1">Welcome Back</h2>
                        <p class="text-xs text-white/50">Enter your credentials to access your account.</p>
                    </div>
                    
                    <div>
                        <label class="text-[10px] text-white/50 uppercase tracking-widest ml-2 mb-2 block">Email Address</label>
                        <input type="email" id="loginEmail" required placeholder="name@example.com" class="glass-input w-full rounded-2xl px-5 py-4 text-sm interaction-btn">
                    </div>
                    
                    <div>
                        <label class="text-[10px] text-white/50 uppercase tracking-widest ml-2 mb-2 block">Password</label>
                        <div class="relative">
                            <input type="password" id="loginPass" required placeholder="••••••••" class="glass-input w-full rounded-2xl px-5 py-4 text-sm pr-12 interaction-btn">
                            <button type="button" onclick="togglePassword('loginPass', this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-white/50 hover:text-white focus:outline-none interaction-btn">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="text-right mt-2">
                            <button type="button" onclick="forgotPassword()" class="text-[10px] text-white/50 hover:text-white transition-colors interaction-btn">Forgot Password?</button>
                        </div>
                    </div>
                    
                    <button type="submit" class="w-full bg-white text-black font-bold py-4 rounded-2xl mt-2 hover:scale-[1.02] transition-transform shadow-[0_0_20px_rgba(255,255,255,0.2)] interaction-btn">
                        Sign In
                    </button>

                    <!-- Google Sign In Button -->
                    <div class="relative flex items-center py-2">
                        <div class="flex-grow border-t border-white/10"></div>
                        <span class="flex-shrink-0 mx-4 text-white/30 text-xs">OR</span>
                        <div class="flex-grow border-t border-white/10"></div>
                    </div>
                    
                    <button type="button" onclick="handleGoogleSignIn()" class="w-full bg-white/5 border border-white/10 text-white font-bold py-3 rounded-2xl hover:bg-white/10 transition-all interaction-btn flex items-center justify-center gap-3">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" class="w-5 h-5"> Continue with Google
                    </button>
                    
                    <div class="text-center mt-6">
                        <p class="text-xs text-white/50">New to HoRly's Tech? <button type="button" onclick="toggleForms()" class="text-sky-400 font-bold hover:text-white transition-colors interaction-btn">Create Account</button></p>
                    </div>
                </form>

                <!-- REGISTER FORM -->
                <form id="registerForm" class="form-container hidden-form space-y-4" onsubmit="handleAuth(event, 'register')">
                    <div class="text-center mb-6">
                        <h2 class="text-2xl font-bold text-white mb-1">Create Account</h2>
                        <p class="text-xs text-white/50">Join the ultimate gadget hub.</p>
                    </div>
                    
                    <div>
                        <label class="text-[10px] text-white/50 uppercase tracking-widest ml-2 mb-2 block">Full Name</label>
                        <input type="text" id="regName" required placeholder="John Doe" class="glass-input w-full rounded-2xl px-5 py-4 text-sm interaction-btn">
                    </div>
                    <div>
                        <label class="text-[10px] text-white/50 uppercase tracking-widest ml-2 mb-2 block">Email Address</label>
                        <input type="email" id="regEmail" required placeholder="name@example.com" class="glass-input w-full rounded-2xl px-5 py-4 text-sm interaction-btn">
                    </div>
                    <div>
                        <label class="text-[10px] text-white/50 uppercase tracking-widest ml-2 mb-2 block">Password</label>
                        <div class="relative">
                            <input type="password" id="regPass" required placeholder="Create a password" class="glass-input w-full rounded-2xl px-5 py-4 text-sm pr-12 interaction-btn">
                            <button type="button" onclick="togglePassword('regPass', this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-white/50 hover:text-white focus:outline-none interaction-btn">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <button type="submit" class="w-full bg-sky-500 text-white font-bold py-4 rounded-2xl mt-4 hover:scale-[1.02] transition-transform shadow-[0_0_20px_rgba(14,165,233,0.4)] interaction-btn">
                        Sign Up
                    </button>

                    <!-- Google Sign In Button -->
                    <div class="relative flex items-center py-2">
                        <div class="flex-grow border-t border-white/10"></div>
                        <span class="flex-shrink-0 mx-4 text-white/30 text-xs">OR</span>
                        <div class="flex-grow border-t border-white/10"></div>
                    </div>
                    
                    <button type="button" onclick="handleGoogleSignIn()" class="w-full bg-white/5 border border-white/10 text-white font-bold py-3 rounded-2xl hover:bg-white/10 transition-all interaction-btn flex items-center justify-center gap-3">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" class="w-5 h-5"> Sign up with Google
                    </button>
                    
                    <div class="text-center mt-6">
                        <p class="text-xs text-white/50">Already have an account? <button type="button" onclick="toggleForms()" class="text-white font-bold hover:text-sky-400 transition-colors interaction-btn">Sign In</button></p>
                    </div>
                </form>
            </div>
            
            <div class="mt-8 flex items-center justify-center gap-4">
                <div class="h-px bg-white/10 flex-1"></div>
                <span class="text-[10px] text-white/30 uppercase tracking-widest">Secure</span>
                <div class="h-px bg-white/10 flex-1"></div>
            </div>
        </div>
    </div>

    <script>
        // FORM TOGGLE LOGIC
        function toggleForms() {
            const login = document.getElementById('loginForm');
            const register = document.getElementById('registerForm');
            
            if (login.classList.contains('active-form')) {
                login.classList.remove('active-form');
                login.classList.add('hidden-form');
                register.classList.remove('hidden-form');
                register.classList.add('active-form');
            } else {
                register.classList.remove('active-form');
                register.classList.add('hidden-form');
                login.classList.remove('hidden-form');
                login.classList.add('active-form');
            }
        }

        // TOGGLE PASSWORD VISIBILITY
        function togglePassword(inputId, btnElement) {
            const input = document.getElementById(inputId);
            const icon = btnElement.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash', 'text-sky-400');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash', 'text-sky-400');
                icon.classList.add('fa-eye');
            }
        }

        // FORGOT PASSWORD
        async function forgotPassword() {
            const email = prompt("Enter your email address to receive a password reset link:");
            if (email) {
                try {
                    await auth.sendPasswordResetEmail(email);
                    alert("Password reset email sent! Please check your inbox.");
                } catch (error) {
                    alert("Error: " + error.message);
                }
            }
        }

        // GOOGLE SIGN IN
        async function handleGoogleSignIn() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                
                // Check if user exists in Firestore
                const docRef = await db.collection('users').doc(user.uid).get();
                if (!docRef.exists) {
                    await db.collection('users').doc(user.uid).set({
                        name: user.displayName || 'Google User',
                        email: user.email,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        role: 'customer'
                    });
                }
                window.location.href = 'index.html';
            } catch (error) {
                alert("Google Sign-In Error: " + error.message);
            }
        }

        // EMAIL & PASSWORD AUTHENTICATION
        async function handleAuth(e, type) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> Processing...`;
            
            try {
                if (type === 'login') {
                    const email = document.getElementById('loginEmail').value;
                    const pass = document.getElementById('loginPass').value;
                    
                    const userCredential = await auth.signInWithEmailAndPassword(email, pass);
                    const user = userCredential.user;
                    
                    // Force Email Verification Check
                    if (!user.emailVerified) {
                        await auth.signOut();
                        alert("Access Denied: Please verify your email address before logging in. Check your inbox for the verification link.");
                        btn.innerHTML = originalText;
                        return;
                    }
                    
                    window.location.href = 'index.html';
                    
                } else {
                    const name = document.getElementById('regName').value;
                    const email = document.getElementById('regEmail').value;
                    const pass = document.getElementById('regPass').value;
                    
                    // Create user
                    const userCredential = await auth.createUserWithEmailAndPassword(email, pass);
                    const user = userCredential.user;
                    
                    // Send Verification Email
                    await user.sendEmailVerification();
                    
                    // Save additional user info to Firestore
                    await db.collection('users').doc(user.uid).set({
                        name: name,
                        email: email,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        role: 'customer'
                    });
                    
                    // Immediately log them out and require verification
                    await auth.signOut();
                    alert("Account successfully created! However, you MUST verify your email before logging in. A verification link has been sent to your inbox.");
                    
                    toggleForms(); // Bring them back to the login screen
                    btn.innerHTML = originalText;
                }
            } catch (error) {
                alert("Error: " + error.message);
                btn.innerHTML = originalText;
            }
        }
    </script>

    <script src="script.js"></script>

</body>
</html>
