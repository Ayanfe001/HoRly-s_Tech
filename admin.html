<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoRly’s Tech | Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: white; overflow-x: hidden; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .liquid-glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(40px); border: 1px solid rgba(255,255,255,0.1); border-radius: 1.5rem; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .gradient-text { background: linear-gradient(135deg, #fff 0%, #a5b4fc 50%, #38bdf8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
</head>
<body class="flex h-screen overflow-hidden">

    <div class="w-64 liquid-glass m-4 flex flex-col p-6 hidden md:flex">
        <h1 class="orbitron text-xl font-bold tracking-tighter mb-10"><span class="text-red-500">Admin</span>_<span class="gradient-text">Panel</span></h1>
        
        <nav class="space-y-4 flex-1">
            <button onclick="switchTab('dashboard')" class="w-full text-left px-4 py-3 rounded-xl bg-white/10 text-white font-medium hover:bg-white/20 transition"><i class="fas fa-chart-line w-6"></i> Dashboard</button>
            <button onclick="switchTab('users')" class="w-full text-left px-4 py-3 rounded-xl text-white/60 hover:text-white hover:bg-white/10 transition"><i class="fas fa-users w-6"></i> Customers</button>
            <button onclick="switchTab('inventory')" class="w-full text-left px-4 py-3 rounded-xl text-white/60 hover:text-white hover:bg-white/10 transition"><i class="fas fa-box w-6"></i> Inventory</button>
            <button onclick="switchTab('deals')" class="w-full text-left px-4 py-3 rounded-xl text-white/60 hover:text-white hover:bg-white/10 transition"><i class="fas fa-bolt w-6"></i> Flash Deals</button>
        </nav>
        
        <button onclick="adminLogout()" class="mt-auto px-4 py-3 rounded-xl border border-red-500/30 text-red-400 hover:bg-red-500/10 transition"><i class="fas fa-sign-out-alt w-6"></i> Exit Admin</button>
    </div>

    <div class="flex-1 p-4 md:p-8 overflow-y-auto">
        <div id="tab-dashboard" class="tab-content">
            <h2 class="orbitron text-3xl font-bold mb-8">System <span class="gradient-text">Overview</span></h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="liquid-glass p-6"><h3 class="text-white/50 text-sm">Total Customers</h3><p id="stat-users" class="text-4xl font-bold orbitron mt-2">0</p></div>
                <div class="liquid-glass p-6"><h3 class="text-white/50 text-sm">Active Inventory</h3><p id="stat-inv" class="text-4xl font-bold orbitron mt-2">0</p></div>
                <div class="liquid-glass p-6"><h3 class="text-white/50 text-sm">System Status</h3><p class="text-xl font-bold text-green-400 mt-2"><i class="fas fa-check-circle"></i> Online</p></div>
            </div>
        </div>

        <div id="tab-users" class="tab-content hidden">
            <h2 class="orbitron text-3xl font-bold mb-8">Customer <span class="gradient-text">Records</span></h2>
            <div class="liquid-glass p-6 overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="text-white/50 uppercase border-b border-white/10">
                        <tr><th class="pb-4">Name</th><th class="pb-4">Email</th><th class="pb-4">Purchase History</th></tr>
                    </thead>
                    <tbody id="userTableBody" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-inventory" class="tab-content hidden">
            <div class="flex justify-between items-center mb-8">
                <h2 class="orbitron text-3xl font-bold">Manage <span class="gradient-text">Inventory</span></h2>
                <button onclick="alert('In a real app, this opens an upload form!')" class="bg-white text-black px-4 py-2 rounded-lg font-bold text-sm"><i class="fas fa-plus"></i> Add Item</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="adminInventoryGrid"></div>
        </div>
    </div>

    <script>
        // Security Check
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser || currentUser.role !== 'admin') {
            window.location.href = 'index.html'; // Kick out intruders
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');
        }

        function adminLogout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }

        // Load Data
        function loadAdminData() {
            const users = JSON.parse(localStorage.getItem('users')) || [];
            const inventory = JSON.parse(localStorage.getItem('inventory')) || [];
            
            // Stats
            document.getElementById('stat-users').innerText = users.length;
            document.getElementById('stat-inv').innerText = inventory.length;

            // Load Users
            const userTable = document.getElementById('userTableBody');
            userTable.innerHTML = users.map(u => `
                <tr class="hover:bg-white/5">
                    <td class="py-4 font-bold">${u.name}</td>
                    <td class="py-4 text-white/70">${u.email}</td>
                    <td class="py-4 text-sky-400 text-xs">${u.records.length > 0 ? u.records.length + ' orders' : 'No orders yet'}</td>
                </tr>
            `).join('');

            // Load Inventory
            const invGrid = document.getElementById('adminInventoryGrid');
            invGrid.innerHTML = inventory.map((item, index) => `
                <div class="liquid-glass p-4 flex gap-4">
                    <img src="${item.image}" class="w-16 h-16 rounded-lg object-cover">
                    <div>
                        <h4 class="font-bold text-sm">${item.name}</h4>
                        <p class="text-xs text-white/50 mb-2">${item.category}</p>
                        <button onclick="deleteItem(${index})" class="text-xs text-red-400 border border-red-500/30 px-2 py-1 rounded">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function deleteItem(index) {
            let inventory = JSON.parse(localStorage.getItem('inventory'));
            inventory.splice(index, 1);
            localStorage.setItem('inventory', JSON.stringify(inventory));
            loadAdminData();
        }

        loadAdminData();
    </script>
</body>
</html>
